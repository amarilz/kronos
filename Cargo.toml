[package]
name = "kronos"
version = "1.0.4"
edition = "2024"

[[bin]]
name = "kronos"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = "0.4"
crossterm = "0.28"
dirs = "6"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.3.1"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
